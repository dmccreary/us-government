<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Enlightenment Ideas to American Institutions</title>
    <link href="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f6efd9; color: #2a2418; }
        #wrap { max-width: 1100px; margin: 0 auto; padding: 8px 12px 12px; }
        h1 { font-size: 18px; margin: 0 0 6px; color: #4b3c1a; }
        #controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        button { background: #6b5524; color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
        button:hover { background: #4b3c1a; }
        select { padding: 5px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #c8b896; }
        #timeline { border: 1px solid #c8b896; border-radius: 6px; background: #fdfaf0; padding: 10px; min-height: 320px; }
        #info { margin-top: 8px; padding: 10px 12px; background: #fdfaf0; border: 1px solid #c8b896; border-radius: 6px; font-size: 13px; min-height: 70px; }
        #info h3 { margin: 0 0 4px; font-size: 14px; color: #4b3c1a; }
        #info .body { color: #2a2418; }
        .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #4b3c1a; margin-top: 6px; }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
        .vis-item.philo { background: #90caf9; border-color: #0d47a1; color: #001233; }
        .vis-item.event { background: #ef9a9a; border-color: #b71c1c; color: #2a0000; }
        .vis-item.doc   { background: #a5d6a7; border-color: #1b5e20; color: #002200; }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>Enlightenment Ideas → American Institutions (1689 – 1791)</h1>
        <div id="controls">
            <button id="fitBtn">Fit All</button>
            <select id="catFilter">
                <option value="all">All Categories</option>
                <option value="philo">Philosophical Works</option>
                <option value="event">American Events</option>
                <option value="doc">Founding Documents</option>
            </select>
            <span class="legend">
                <span><span class="sw" style="background:#90caf9"></span>Philosophy</span>
                <span><span class="sw" style="background:#ef9a9a"></span>American Event</span>
                <span><span class="sw" style="background:#a5d6a7"></span>Founding Document</span>
            </span>
        </div>
        <div id="timeline"></div>
        <div id="info">Click any item to see how Enlightenment ideas shaped American institutions.</div>
    </div>
    <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script src="enlightenment-to-constitution-timeline.js"></script>
</body>
</html>
