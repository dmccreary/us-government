<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Federalism Evolution Timeline</title>
    <link href="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; color: #212529; }
        #wrap { max-width: 1100px; margin: 0 auto; padding: 8px 12px 12px; }
        h1 { font-size: 18px; margin: 0 0 6px; color: #1a3a6c; }
        #controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        button { background: #1a3a6c; color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
        button:hover { background: #122a4f; }
        select { padding: 5px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #ced4da; }
        #timeline { border: 1px solid #ced4da; border-radius: 6px; background: #fff; padding: 10px; min-height: 320px; }
        #info { margin-top: 8px; padding: 10px 12px; background: #fff; border: 1px solid #ced4da; border-radius: 6px; font-size: 13px; min-height: 80px; }
        #info h3 { margin: 0 0 4px; font-size: 14px; color: #1a3a6c; }
        #info .body { margin-bottom: 4px; }
        #info .shift { display: inline-block; padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 11px; }
        .shift.nat { background: #ffcdd2; color: #b71c1c; }
        .shift.state { background: #c5e1a5; color: #33691e; }
        .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #495057; margin-top: 6px; }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
        .vis-item.dual { background: #ef9a9a; border-color: #b71c1c; color: #2a0000; }
        .vis-item.coop { background: #90caf9; border-color: #0d47a1; color: #001233; }
        .vis-item.new  { background: #ce93d8; border-color: #6a1b9a; color: #1a0033; }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>Federalism Evolution — Dual → Cooperative → New Federalism</h1>
        <div id="controls">
            <button id="fitBtn">Fit All</button>
            <select id="eraFilter">
                <option value="all">All Eras</option>
                <option value="dual">Dual Federalism (1789–1933)</option>
                <option value="coop">Cooperative Federalism (1933–1970s)</option>
                <option value="new">New Federalism (1970s–present)</option>
            </select>
            <span class="legend">
                <span><span class="sw" style="background:#ef9a9a"></span>Dual Federalism</span>
                <span><span class="sw" style="background:#90caf9"></span>Cooperative Federalism</span>
                <span><span class="sw" style="background:#ce93d8"></span>New Federalism</span>
            </span>
        </div>
        <div id="timeline"></div>
        <div id="info">Click any event to see how it shifted the balance between national and state power.</div>
    </div>
    <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script src="federalism-evolution-timeline.js"></script>
</body>
</html>
