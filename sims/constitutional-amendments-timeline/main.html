<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Constitutional Amendment Timeline</title>
    <link href="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f8f9fa; color: #212529; }
        #wrap { max-width: 1100px; margin: 0 auto; padding: 8px 12px 12px; }
        h1 { font-size: 18px; margin: 0 0 6px; color: #1a3a6c; }
        #controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
        button { background: #1a3a6c; color: #fff; border: 0; border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
        button:hover { background: #122a4f; }
        select { padding: 5px 8px; font-size: 12px; border-radius: 4px; border: 1px solid #ced4da; }
        #timeline { border: 1px solid #ced4da; border-radius: 6px; background: #fff; padding: 10px; min-height: 320px; }
        #info { margin-top: 8px; padding: 10px 12px; background: #fff; border: 1px solid #ced4da; border-radius: 6px; font-size: 13px; min-height: 80px; }
        #info h3 { margin: 0 0 4px; font-size: 14px; color: #1a3a6c; }
        #info .summary { margin-bottom: 4px; }
        #info .driver { color: #495057; font-style: italic; }
        .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #495057; margin-top: 6px; }
        .legend span { display: inline-flex; align-items: center; gap: 4px; }
        .legend .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
        .vis-item.bor    { background: #90caf9; border-color: #0d47a1; color: #001233; }
        .vis-item.civ    { background: #ef9a9a; border-color: #b71c1c; color: #2a0000; }
        .vis-item.prog   { background: #a5d6a7; border-color: #1b5e20; color: #002200; }
        .vis-item.expand { background: #ffcc80; border-color: #ef6c00; color: #2a1500; }
        .vis-item.other  { background: #cfd8dc; border-color: #455a64; color: #102027; }
        .vis-item.starred { box-shadow: 0 0 0 2px #ffd700 inset; font-weight: 700; }
        .vis-item.vis-box .vis-item-content,
        .vis-item.vis-range .vis-item-content,
        .vis-item .vis-item-content {
            white-space: normal !important;
            overflow-wrap: break-word !important;
            word-wrap: break-word !important;
            max-width: 140px !important;
            line-height: 1.2 !important;
            padding: 4px 6px !important;
        }
    </style>
</head>
<body>
    <div id="wrap">
        <h1>U.S. Constitutional Amendments — All 27</h1>
        <div id="controls">
            <button id="fitBtn">Fit All</button>
            <select id="eraFilter">
                <option value="all">All Eras</option>
                <option value="bor">Bill of Rights (1791)</option>
                <option value="civ">Civil War (1865-1870)</option>
                <option value="prog">Progressive Era (1913-1919)</option>
                <option value="expand">20th-Century Expansions</option>
                <option value="other">Other</option>
            </select>
            <span class="legend">
                <span><span class="sw" style="background:#90caf9"></span>Bill of Rights</span>
                <span><span class="sw" style="background:#ef9a9a"></span>Civil War</span>
                <span><span class="sw" style="background:#a5d6a7"></span>Progressive Era</span>
                <span><span class="sw" style="background:#ffcc80"></span>20th-c. Expansions</span>
                <span><span class="sw" style="background:#cfd8dc"></span>Other</span>
                <span><span class="sw" style="background:#ffd700;border:1px solid #b8860b"></span>★ Course-covered</span>
            </span>
        </div>
        <div id="timeline"></div>
        <div id="info">Click any amendment on the timeline to see details. Starred amendments (★) are highlighted in this course.</div>
    </div>
    <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script src="constitutional-amendments-timeline.js"></script>
</body>
</html>
